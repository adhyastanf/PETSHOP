name: Backend CI

on:
  push:
    paths:
      - 'PETSHOP-API/**'
    branches: [dev, main]
  pull_request:
    paths:
      - 'PETSHOP-API/**'
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PETSHOP-API

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: petshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/petshop_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: testpass
          JWT_SECRET: ci-test-secret-must-be-at-least-32-bytes-long!!
          CORS_ALLOWED_ORIGINS: http://localhost:3000
        run: mvn verify -B -q

      - name: Verify build artifact
        run: test -f target/*.jar || mvn package -B -q -DskipTests
