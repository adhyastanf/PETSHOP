name: Frontend CI

on:
  push:
    paths:
      - 'PETSHOP-UI/**'
    branches: [dev, main]
  pull_request:
    paths:
      - 'PETSHOP-UI/**'
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PETSHOP-UI

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PETSHOP-UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com/api/v1
          NEXT_PUBLIC_APP_NAME: Oyen
          NEXT_PUBLIC_DEFAULT_LOCALE: en
          NEXT_PUBLIC_SUPPORTED_LOCALES: en,id
          NEXT_PUBLIC_ENVIRONMENT: ci
        run: npm run build
