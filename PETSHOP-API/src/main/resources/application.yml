spring:
  application:
    name: petshop-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/petshop}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Petshop@2026}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-32-bytes-long!!}
    access-token-expiry: 900
    refresh-token-expiry: 604800
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
