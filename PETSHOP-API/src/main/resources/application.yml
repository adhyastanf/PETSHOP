spring:
  application:
    name: petshop-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/petshop}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:Petshop@2026}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:public}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:public}
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

app:
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-32-bytes-long!!}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:900}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    provider: ${STORAGE_PROVIDER:local}
    local-path: ${STORAGE_LOCAL_PATH:./storage}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
